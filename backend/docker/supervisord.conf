[supervisord]
nodaemon=true
logfile=/var/www/storage/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid
loglevel=info

; ── Laravel HTTP server ───────────────────────────────────────────────────────
[program:laravel-server]
command=php /var/www/artisan serve --host=0.0.0.0 --port=8000
directory=/var/www
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/www/storage/logs/laravel-server.log
stderr_logfile=/var/www/storage/logs/laravel-server.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
user=www-data

; ── Queue worker ─────────────────────────────────────────────────────────────
[program:laravel-queue]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/www/storage/logs/queue.log
stderr_logfile=/var/www/storage/logs/queue.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
user=www-data

; ── Laravel Reverb (WebSocket) ────────────────────────────────────────────────
[program:laravel-reverb]
command=php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/www/storage/logs/reverb.log
stderr_logfile=/var/www/storage/logs/reverb.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
user=www-data
